[workspace]
resolver = "2"
members = ["crates/avr-core", "src-tauri"]
default-members = ["crates/avr-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
serialport = { version = "4.10", default-features = false }
tempfile = "3"
